# Jekyll Garden Configuration — Shawn Mix Personal Site

# Preferences (controls template behavior)
preferences:
  homepage:
    enabled: true
  search:
    enabled: true
  backlinks:
    enabled: true
  pagepreview:
    enabled: true
  wiki_style_link:
    enabled: true

# Site Configuration
reading_speed: 200   # words per minute, used for post read-time estimates
title: "Shawn Mix"
heading: "Shawn Mix"
description: "Personal site, blog, and digital garden"
url: ""
baseurl: ""

# Asset Configuration
apple_touch_icon: "/assets/img/OGImg.png"
css_file: "/assets/css/style.css"

# Menu — empty; navigation is handled by the landing page card grid
menu: []

# Personal links — single source of truth; referenced via site.links.* everywhere
links:
  github:          "https://github.com/1activegeek"
  linkedin:        "https://www.linkedin.com/in/shawn-mix/"
  kofi:            "https://ko-fi.com/shawnmix"
  paypal:          "https://www.paypal.com/paypalme/shawnmix/3"
  resume_download: "https://www.icloud.com/iclouddrive/09aWUpQiJlCdAfX212odnjgag#Shawn_Mix_Resume_-_Current"
  website:         "https://1activegeek.com"

# Footer — minimal, no copyright/credits
footer:
  copyright: ""
  credits:
    enabled: false
    url: "/credits"
    text: "Credits"

# Collections
collections:
  notes:
    output: true
    permalink: /:collection/:name

# Defaults
defaults:
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "Post"
      content-type: "notes"
      feed: "show"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "Post"
      content-type: "post"
      feed: "show"
      permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Private links (for broken wiki links)
privatelinks:
  title: "Private Note"
  msg: "This note hasn't been published yet."

# Math rendering
katex: false

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .opencode/
