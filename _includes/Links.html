{%- assign r = site.data.resume -%}
<div class="links-page">

  <!-- Profile -->
  <div class="links-profile">
    <img
      class="links-avatar"
      src="{{ site.baseurl }}/assets/images/profile.png"
      alt="Photo of {{ r.profile.name }}"
      width="132"
      height="132"
    />
    <div class="links-profile-name">{{ r.profile.name }}</div>
    <div class="links-profile-tagline">{{ r.profile.tagline }}</div>
    <div class="links-profile-location">
      <!-- map pin icon -->
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      {{ r.profile.location }}
    </div>
  </div>

  <!-- Link Buttons -->
  <div class="links-list">

    <!-- Online CV -->
    <a class="links-btn" href="{{ site.baseurl }}/resume">
      <span class="links-btn-icon">
        <!-- file-text icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </span>
      <span class="links-btn-label">Online CV</span>
    </a>

    <!-- Download CV -->
    {%- if site.links.resume_download -%}
    <a class="links-btn" href="{{ site.links.resume_download }}" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- download icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </span>
      <span class="links-btn-label">Download CV</span>
    </a>
    {%- endif -%}

    <!-- Website -->
    <a class="links-btn" href="{{ site.links.website }}" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- globe icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </span>
      <span class="links-btn-label">Website</span>
    </a>

    <!-- LinkedIn -->
    <a class="links-btn" href="{{ site.links.linkedin }}" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- linkedin icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="3" ry="3"/>
          <line x1="8" y1="11" x2="8" y2="17"/>
          <line x1="8" y1="8" x2="8" y2="8.01"/>
          <line x1="12" y1="17" x2="12" y2="13"/>
          <path d="M12 11a3 3 0 0 1 6 0v6"/>
        </svg>
      </span>
      <span class="links-btn-label">LinkedIn</span>
    </a>

    <!-- GitHub -->
    <a class="links-btn" href="{{ site.links.github }}" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- github icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
      </span>
      <span class="links-btn-label">GitHub</span>
    </a>

    <!-- Docker Hub -->
    <a class="links-btn" href="https://hub.docker.com/u/1activegeek" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- container/box icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      </span>
      <span class="links-btn-label">Docker Hub</span>
    </a>

    <!-- Keybase -->
    <a class="links-btn" href="https://keybase.io/shawnmix" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- key icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
      </span>
      <span class="links-btn-label">Keybase</span>
    </a>

    <!-- Donation / PayPal -->
    <a class="links-btn" href="{{ site.links.paypal }}" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- heart icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </span>
      <span class="links-btn-label">Make a Donation</span>
    </a>

    <!-- Ko-fi -->
    <a class="links-btn" href="{{ site.links.kofi }}" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- coffee icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/>
          <line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
      </span>
      <span class="links-btn-label">Buy me a Coffee</span>
    </a>

    <!-- Tesla Referral -->
    <a class="links-btn" href="https://ts.la/shawn22515" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- lightning bolt icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </span>
      <span class="links-btn-label">Tesla Referral</span>
    </a>

    <!-- Jot Referral -->
    <a class="links-btn" href="https://rc-refer.com/shawn-c9w6gk" target="_blank" rel="noopener noreferrer">
      <span class="links-btn-icon">
        <!-- coffee icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/>
          <line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
      </span>
      <span class="links-btn-label">Jot Referral</span>
    </a>

  </div><!-- /.links-list -->
</div><!-- /.links-page -->
