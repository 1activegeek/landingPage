<nav class="nav">
  <div class="nav-left">
    <a href="{{ site.baseurl }}/" aria-label="Home" data-tooltip="Home">
      <span class="nav-initials"><span class="nav-initial-s">S</span><span class="nav-initial-m">M</span></span>
    </a>
  </div>
  <div class="nav-right">
    <button class="theme-toggle" aria-label="Toggle dark mode" data-tooltip="Toggle theme">
      <svg viewBox="0 0 14 14" width="17.5" height="17.5" xmlns="http://www.w3.org/2000/svg" class="theme-icon">
        <!-- Left half: arc from bottom to top (dark side in dark mode) -->
        <path class="icon-left" d="M7,2 A5,5 0 0,0 7,12 Z"/>
        <!-- Right half: arc from top to bottom (light side in dark mode) -->
        <path class="icon-right" d="M7,2 A5,5 0 0,1 7,12 Z"/>
      </svg>
    </button>
  </div>
</nav>

<script>
  const themeToggle = document.querySelector('.theme-toggle');
  const root = document.documentElement;

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }

  themeToggle.addEventListener('click', function () {
    root.classList.add('theme-transition');
    document.body.classList.add('theme-transition');
    const isDark = root.getAttribute('data-theme') === 'dark';
    setTheme(isDark ? 'light' : 'dark');
    setTimeout(function () {
      root.classList.remove('theme-transition');
      document.body.classList.remove('theme-transition');
    }, 300);
  });
</script>
