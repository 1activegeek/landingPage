  <div class="nav-left">
    <a href="{{ site.baseurl }}/" aria-label="Home" data-tooltip="Home">
      <span class="nav-initials"><span class="nav-initial-s">S</span><span class="nav-initial-m">M</span></span>
    </a>
  </div>
  <div class="nav-right">
    <button class="theme-toggle" aria-label="Toggle dark mode" data-tooltip="Toggle theme">
      <svg viewBox="0 0 14 14" width="17.5" height="17.5" xmlns="http://www.w3.org/2000/svg" class="theme-icon">
        <!-- Left half: arc from bottom to top (dark side in dark mode) -->
        <path class="icon-left" d="M7,2 A5,5 0 0,0 7,12 Z"/>
        <!-- Right half: arc from top to bottom (light side in dark mode) -->
        <path class="icon-right" d="M7,2 A5,5 0 0,1 7,12 Z"/>
      </svg>
    </button>
  </div>
</nav>

<script>
  (function () {
    var toggle = document.querySelector('.theme-toggle');
    var root = document.documentElement;

    // Determine the current effective theme (what the user actually sees)
    function getEffective() {
      var attr = root.getAttribute('data-theme');
      if (attr === 'dark' || attr === 'light') return attr;
      // No attribute — CSS @media is in control, check what OS says
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    // Update tooltip to reflect what's shown
    function updateTooltip() {
      var effective = getEffective();
      var label = effective === 'dark' ? 'Dark' : 'Light';
      toggle.setAttribute('aria-label', 'Theme: ' + label);
      toggle.setAttribute('data-tooltip', label);
    }

    // Toggle: dark ↔ light
    toggle.addEventListener('click', function () {
      // Enable smooth transition
      root.classList.add('theme-transition');

      var next = getEffective() === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      root.setAttribute('data-theme', next);
      updateTooltip();

      setTimeout(function () {
        root.classList.remove('theme-transition');
      }, 300);
    });

    // Set initial tooltip (theme was already applied by head script or CSS @media)
    updateTooltip();
  })();
</script>
