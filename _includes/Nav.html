<nav class="nav">
  <div class="nav-left">
    <a href="{{ site.baseurl }}/" aria-label="Home" data-tooltip="Home">
      <span class="nav-initials"><span class="nav-initial-s">S</span><span class="nav-initial-m">M</span></span>
    </a>
  </div>
  <div class="nav-right">
    <button class="theme-toggle" aria-label="Toggle dark mode" data-tooltip="Toggle theme">
      <svg viewBox="0 0 14 14" width="17.5" height="17.5" xmlns="http://www.w3.org/2000/svg" class="theme-icon">
        <!-- Left half: arc from bottom to top (dark side in dark mode) -->
        <path class="icon-left" d="M7,2 A5,5 0 0,0 7,12 Z"/>
        <!-- Right half: arc from top to bottom (light side in dark mode) -->
        <path class="icon-right" d="M7,2 A5,5 0 0,1 7,12 Z"/>
      </svg>
    </button>
  </div>
</nav>

<script>
  const themeToggle = document.querySelector('.theme-toggle');
  const root = document.documentElement;
  const systemMQ = window.matchMedia('(prefers-color-scheme: dark)');

  // Apply the visual theme based on stored preference
  function applyTheme(stored) {
    if (stored === 'system') {
      root.setAttribute('data-theme', systemMQ.matches ? 'dark' : 'light');
    } else {
      root.setAttribute('data-theme', stored);
    }
    themeToggle.setAttribute('aria-label', 'Theme: ' + stored);
    themeToggle.setAttribute('data-tooltip', stored.charAt(0).toUpperCase() + stored.slice(1));
  }

  // Cycle: dark → light → system → dark
  themeToggle.addEventListener('click', function () {
    root.classList.add('theme-transition');
    document.body.classList.add('theme-transition');

    const currentVisual = root.getAttribute('data-theme');
    const next = currentVisual === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);

    setTimeout(function () {
      root.classList.remove('theme-transition');
      document.body.classList.remove('theme-transition');
    }, 300);
  });

  // Follow OS changes in real time when set to system
  systemMQ.addEventListener('change', function () {
    if ((localStorage.getItem('theme') || 'dark') === 'system') {
      root.setAttribute('data-theme', systemMQ.matches ? 'dark' : 'light');
    }
  });

  // Sync tooltip/aria-label with current stored preference on load
  applyTheme(localStorage.getItem('theme') || 'system');
</script>
